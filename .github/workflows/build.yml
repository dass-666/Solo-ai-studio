name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows x64 (VST3)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configurar (Visual Studio 2022, x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Compilar (Release)
        run: cmake --build build --config Release --parallel

      - name: Pruebas unitarias del núcleo
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Host de prueba (carga el VST3 como un DAW)
        shell: pwsh
        run: '& "build/plugin/SoloHostTest_artefacts/Release/SoloHostTest.exe" "build/plugin/SoloAIStudio_artefacts/Release/VST3/Solo AI Studio.vst3"'

      - name: pluginval (informativo)
        # Validador de plugins de Tracktion (herramienta externa; no se redistribuye).
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          # pluginval.exe es una aplicación gráfica: PowerShell no la espera con "&". Start-Process -Wait sí.
          $p = Start-Process pluginval/pluginval.exe -Wait -NoNewWindow -PassThru -ArgumentList @(
            "--strictness-level", "5", "--validate-in-process", "--skip-gui-tests", "--output-dir", "pluginval-logs",
            "`"build/plugin/SoloAIStudio_artefacts/Release/VST3/Solo AI Studio.vst3`"")
          Write-Host "pluginval (carpeta de compilación): código de salida $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "pluginval falló" }

      - name: Batería de demos (MIDI + WAV)
        run: |
          mkdir examples-out
          build/Release/solo_cli.exe demos examples-out

      - name: Empaquetar (VST3 + standalone + instalador + guía + ejemplos)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/ejemplos | Out-Null
          Copy-Item -Recurse "build/plugin/SoloAIStudio_artefacts/Release/VST3/Solo AI Studio.vst3" package/
          Copy-Item "build/plugin/SoloAIStudio_artefacts/Release/Standalone/Solo AI Studio.exe" package/
          Copy-Item packaging/Instalar-SoloAIStudio.ps1 package/
          Copy-Item packaging/PRUEBAS-FL.md package/
          Copy-Item docs/INSTALL.md package/LEEME.md
          Copy-Item docs/MIDI.md package/
          Copy-Item docs/LICENSES.md package/
          $cli = "build/Release/solo_cli.exe"
          & $cli generate --key Am --prog "Am F C G" --bpm 146 --style rock --fx "Classic Rock Lead" --seed 1 --out package/ejemplos/01-rock-Am-146
          & $cli generate --key A --prog "A7 D7 A7 E7" --bpm 96 --bars 8 --style blues --fx "Blues Lead" --seed 7 --out package/ejemplos/02-blues-A-96
          & $cli generate --key Dm --prog "Dm Bb F C" --bpm 80 --instrument flute --style cinematic --fx "Cinematic Lead" --seed 3 --out package/ejemplos/03-cinematico-flauta-Dm-80
          & $cli synthvoice package/ejemplos/04-voz-sintetica-Am-100.wav
          $commit = "${{ github.sha }}"
          $lines = @("Solo AI Studio - commit $commit - $(Get-Date -Format o)")
          foreach ($f in @("Solo AI Studio.vst3/Contents/x86_64-win/Solo AI Studio.vst3", "Solo AI Studio.exe")) {
            $lines += "$((Get-FileHash (Join-Path package $f) -Algorithm SHA256).Hash)  $f"
          }
          $lines | Set-Content package/SHA256SUMS.txt
          Get-Content package/SHA256SUMS.txt

      - name: Instalar en la ruta estándar con el script del paquete y validar la copia instalada
        shell: pwsh
        run: |
          & package/Instalar-SoloAIStudio.ps1
          if ($LASTEXITCODE -ne 0) { throw "El instalador falló" }
          $inst = Join-Path $env:CommonProgramFiles "VST3/Solo AI Studio.vst3"
          & "build/plugin/SoloHostTest_artefacts/Release/SoloHostTest.exe" $inst
          if ($LASTEXITCODE -ne 0) { throw "El host de prueba falló con el VST3 instalado" }
          if (Test-Path pluginval/pluginval.exe) {
            $p = Start-Process pluginval/pluginval.exe -Wait -NoNewWindow -PassThru -ArgumentList @(
              "--strictness-level", "5", "--validate-in-process", "--skip-gui-tests", "`"$inst`"")
            Write-Host "pluginval (copia instalada): código de salida $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { throw "pluginval falló con el VST3 instalado" }
          } else { Write-Host "::warning::pluginval no disponible (descarga fallida); se omite" }
          & package/Instalar-SoloAIStudio.ps1 -Desinstalar
          if (Test-Path $inst) { throw "La desinstalación no borró el plugin" }

      - uses: actions/upload-artifact@v4
        with:
          name: SoloAIStudio-Windows-x64
          path: package/

      - uses: actions/upload-artifact@v4
        with:
          name: SoloAIStudio-ejemplos
          path: examples-out/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pluginval-logs
          path: pluginval-logs/
          if-no-files-found: ignore

  linux:
    name: Linux (núcleo + VST3 + host de prueba)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libgl1-mesa-dev xvfb
      - name: Configurar
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Compilar
        run: cmake --build build
      - name: Pruebas unitarias
        run: ctest --test-dir build --output-on-failure
      - name: Host de prueba (con editor)
        run: xvfb-run -a build/plugin/SoloHostTest_artefacts/Release/SoloHostTest "build/plugin/SoloAIStudio_artefacts/Release/VST3/Solo AI Studio.vst3" --editor

  sanitizers:
    name: Linux (núcleo con ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configurar (sin plugin, con sanitizers)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSOLO_BUILD_PLUGIN=OFF -DSOLO_SANITIZE=ON
      - name: Compilar
        run: cmake --build build
      - name: Pruebas con sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./build/solo_tests
