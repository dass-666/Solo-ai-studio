name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows x64 (VST3)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configurar (Visual Studio 2022, x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Compilar (Release)
        run: cmake --build build --config Release --parallel

      - name: Pruebas unitarias del núcleo
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Host de prueba (carga el VST3 como un DAW)
        shell: pwsh
        run: '& "build/plugin/SoloHostTest_artefacts/Release/SoloHostTest.exe" "build/plugin/SoloAIStudio_artefacts/Release/VST3/Solo AI Studio.vst3"'

      - name: pluginval (informativo)
        # Validador de plugins de Tracktion (herramienta externa; no se redistribuye).
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          & pluginval/pluginval.exe --strictness-level 5 --validate-in-process --skip-gui-tests --output-dir pluginval-logs "build/plugin/SoloAIStudio_artefacts/Release/VST3/Solo AI Studio.vst3"

      - name: Batería de ejemplos (MIDI + WAV)
        run: |
          mkdir examples-out
          build/Release/solo_cli.exe examples examples-out

      - name: Empaquetar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item -Recurse "build/plugin/SoloAIStudio_artefacts/Release/VST3/Solo AI Studio.vst3" package/
          Copy-Item "build/plugin/SoloAIStudio_artefacts/Release/Standalone/Solo AI Studio.exe" package/
          Copy-Item docs/INSTALL.md package/
          Copy-Item docs/LICENSES.md package/

      - uses: actions/upload-artifact@v4
        with:
          name: SoloAIStudio-Windows-x64
          path: package/

      - uses: actions/upload-artifact@v4
        with:
          name: SoloAIStudio-ejemplos
          path: examples-out/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pluginval-logs
          path: pluginval-logs/
          if-no-files-found: ignore

  linux:
    name: Linux (núcleo + VST3 + host de prueba)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libgl1-mesa-dev xvfb
      - name: Configurar
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Compilar
        run: cmake --build build
      - name: Pruebas unitarias
        run: ctest --test-dir build --output-on-failure
      - name: Host de prueba (con editor)
        run: xvfb-run -a build/plugin/SoloHostTest_artefacts/Release/SoloHostTest "build/plugin/SoloAIStudio_artefacts/Release/VST3/Solo AI Studio.vst3" --editor
